service mali
{
	system
		IRQCTL		# its three lines: gpu, job, mmu
		CACHECTL	# the GPU is not coherent: tables, jobs, results
		UMAP		# the physical address of every page the GPU
				# is given: page tables and buffers
		VIRCOPY		# the arrays a client's request points to (the
				# buffers of a job, the sync objects of a wait)
				# and the strings of DRM_IOCTL_VERSION - always
				# in the memory of the process VFS names as the
				# caller, never an endpoint from the request
	;

	# A client's buffers are this service's memory, mapped into the
	# client that asks for them through mmap(2) of the render node, the
	# way fb lends its frames to the compositor (stage 11.6).
	vm	REMAP
	;

	# Three nodes of the device tree, because the GPU of this SoC cannot
	# be brought up from its own registers alone: the GPU itself (its
	# window and its three interrupt lines), the clock unit that gates
	# it, and the PMU that holds its power domain.  The last two are
	# shared with the rest of the machine - sdmmc, dwmac and fb open
	# gates in the same unit, xhci and fb switch domains in the same PMU
	# - and each driver writes only its own bits, write-masked.
	devicetree	"arm,mali-bifrost";
	devicetree	"rockchip,rk3568-cru";
	devicetree	"rockchip,rk3568-pmu";
};
