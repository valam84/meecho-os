service usb_kbd
{
	# Nothing beyond the basic kernel calls: no registers, no
	# interrupts, no memory of a device.  The keyboard is reached
	# through the host controller service and its reports leave
	# through the input server, and those two are all it talks to
	# besides the system's own.
	#
	# The controller runs under the label "usbd", but this list names
	# processes, and on this port the process is xhci.  (usb_hub and
	# usb_storage say "usbd", the name of the earm controller binary,
	# and reach xhci only because xhci's own list is ALL_SYS.)
	ipc
		SYSTEM pm rs ds vm
		xhci input
	;
	uid	0;
};
