service cpuprobe
{
	# The Mi Pad 4's CPU-frequency probe (port/clover/cpuprobe): reads
	# only.  The blocks that clock and power the CPU clusters - one node
	# that sdm660-xiaomi-clover-cpu.dtsi adds, since the mainline tree
	# describes none of them - and the three it reads around them: the
	# fuses (speed bin, open-loop voltages), the GCC (the CPR clock and
	# the 300 MHz alternate source) and the SPMI arbiter (PM660 S1-S3,
	# the CPU rails, through the observer channels).
	devicetree	"meecho,sdm660-cpu-dvfs";
	devicetree	"qcom,qfprom";
	devicetree	"qcom,gcc-sdm660";
	devicetree	"qcom,spmi-pmic-arb";
	ipc
		SYSTEM pm rs ds vm
	;

	# Off the boot processor, as the adreno probe: a read that stalled
	# the bus would stall this core, and the boot processor's tick - with
	# the boot watchdog that resets the tablet into fastboot - would go
	# on (port/clover/hw-gpu.md, section 12).
	scheduler	KERNEL;
	priority	5;
	quantum		500;
	cpu		1;
};
