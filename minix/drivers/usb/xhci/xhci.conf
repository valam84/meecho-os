service xhci
{
	descr   "xHCI in a Synopsys DWC3, with Rockchip glue";
	system
		UMAP
		VUMAP
		IRQCTL
		DEVIO
		CACHECTL
	;

	# This driver has to be able to send to the drivers it serves, and
	# it cannot name them: which drivers exist for USB devices is not
	# decided here, and the label each one runs under is chosen by
	# whoever starts it - the same reason the network stack asks for
	# this.  Announcements and URB completions travel this way; a
	# refused send is a device that is found and never handed over.
	ipc
		ALL_SYS
	;

	# Six nodes of the device tree, because this controller is six
	# blocks.  That is a real cost of this SoC rather than a shortcut
	# here: a driver that cannot reach them cannot bring its own device
	# up, and each one is asked for by name so that what it is for can
	# be read off this list.
	#
	#   snps,dwc3                     the controller: xHCI and its DWC3
	#   rk3568-usb2phy                the PHY's analogue registers
	#   rk3568-usb2phy-grf            the PHY's logical registers, which
	#                                 are a separate syscon it points at
	#   rk3568-cru                    the controller's clocks and resets
	#                                 (already shared with sdmmc and dwmac)
	#   rk3568-pmucru                 the PHY's 24 MHz reference, which
	#                                 lives in the PMU's own controller
	#   rk3568-pmu                    the power domain both xHCIs sit in
	#
	# CACHECTL is not used at this milestone and is asked for because
	# the rings of the next one cannot work without it: the event ring
	# is memory the controller writes while this driver reads it.
	devicetree	"snps,dwc3";
	devicetree	"rockchip,rk3568-usb2phy";
	devicetree	"rockchip,rk3568-usb2phy-grf";
	devicetree	"rockchip,rk3568-cru";
	devicetree	"rockchip,rk3568-pmucru";
	devicetree	"rockchip,rk3568-pmu";
};
