service mali
{
	system
		IRQCTL		# its three lines: gpu, job, mmu
	;

	# Three nodes of the device tree, because the GPU of this SoC cannot
	# be brought up from its own registers alone: the GPU itself (its
	# window and its three interrupt lines), the clock unit that gates
	# it, and the PMU that holds its power domain.  The last two are
	# shared with the rest of the machine - sdmmc, dwmac and fb open
	# gates in the same unit, xhci and fb switch domains in the same PMU
	# - and each driver writes only its own bits, write-masked.
	devicetree	"arm,mali-bifrost";
	devicetree	"rockchip,rk3568-cru";
	devicetree	"rockchip,rk3568-pmu";
};
