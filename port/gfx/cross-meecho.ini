# meson cross file: MEECHO on AArch64, with the external toolchain of the
# port (aarch64-elf64-minix-*, port/build-xtools.sh).  Used by
# port/gfx/build-stack.sh for the Wayland stack of stage 11; the paths are
# this machine's WSL.
#
# The sysroot is not DESTDIR but a copy of its usr/include and usr/lib
# (~/gfx-sysroot, made by build-stack.sh), into which the packages built
# here are installed in turn: pkg-config then has one root for every .pc
# file, ours and the system's, and nothing lands in DESTDIR - whatever is
# there goes into every root image.
#
# Static only: the userland is static (LDSTATIC in bsd.own.mk), and so is
# everything here.

[constants]
tools = '/home/minix/xtools-aarch64/bin/aarch64-elf64-minix-'
sysroot = '/home/minix/gfx-sysroot'

[binaries]
c = '/home/minix/minix-src/port/gfx/cc.sh'
cpp = tools + 'g++'
ar = tools + 'ar'
strip = tools + 'strip'
ranlib = tools + 'ranlib'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['--sysroot=' + sysroot, '-D_NETBSD_SOURCE']
c_link_args = ['--sysroot=' + sysroot, '-static']
default_library = 'static'
prefer_static = true

[properties]
sys_root = sysroot
pkg_config_libdir = sysroot + '/usr/lib/pkgconfig:' + sysroot + '/usr/share/pkgconfig'
needs_exe_wrapper = true

[host_machine]
system = 'minix'
cpu_family = 'aarch64'
cpu = 'cortex-a55'
endian = 'little'
