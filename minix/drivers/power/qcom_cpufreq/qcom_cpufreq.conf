service qcom_cpufreq
{
	# The Mi Pad 4's CPU clusters at a fixed frequency their rails
	# already hold (minix/drivers/power/qcom_cpufreq; port/clover/
	# hw-cpu.md, path A).  It writes each cluster's mux and PLL - two of
	# the regions of the one node sdm660-xiaomi-clover-cpu.dtsi adds - and
	# reads the rest: the fuses (this chip's voltages), the GCC (the
	# clusters' aux source) and the SPMI arbiter (the rails' set points,
	# through the observer channels; nothing is written to the PMIC).
	devicetree	"meecho,sdm660-cpu-dvfs";
	devicetree	"qcom,qfprom";
	devicetree	"qcom,gcc-sdm660";
	devicetree	"qcom,spmi-pmic-arb";
	ipc
		SYSTEM pm rs ds vm
	;

	# Off the boot processor, as the adreno service and the probe: if a
	# write here ever stalled the bus, the core stalled would be this one,
	# and the boot processor's tick - with the boot watchdog that resets
	# the tablet into fastboot - would go on (port/clover/hw-gpu.md,
	# section 12).
	scheduler	KERNEL;
	priority	5;
	quantum		500;
	cpu		1;
};
