	io	NONE;		# No I/O range allowed
	irq	NONE;		# No IRQ allowed
	sigmgr          rs;	# Signal manager is RS
	scheduler    sched;	# Scheduler is sched
	priority	 5;	# priority queue 5
	quantum	       500;	# default server quantum
