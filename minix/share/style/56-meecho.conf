<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MEECHO's typeface (minix/share/style): JetBrains Mono wherever a program
  asks for monospace - the terminal, the panel, the launcher - and Inter
  for the rest (external/ofl).  After 50-user.conf, so that a user's own
  preferences come first; before 60-latin.conf, so that ours come before
  fontconfig's list of fonts MEECHO has not got.
-->
<fontconfig>
  <description>MEECHO: JetBrains Mono for monospace, Inter for the rest</description>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
