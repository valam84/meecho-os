service tty
{
	uid     0;
	ipc	ALL_SYS;	# All system ipc targets allowed
	system			# Extra kernel calls allowed:
		KILL		# 06
		UMAP		# 14
		VIRCOPY		# 15
		PHYSCOPY	# 16
		IRQCTL		# 19
		DEVIO		# 21
		SDEVIO		# 22
		VDEVIO		# 23
		ABORT		# 27
		IOPENABLE	# 28
		READBIOS	# 35
		;
	vm	BASIC;		# Only basic VM calls allowed
	io	ALL;		# ALL I/O ranges allowed
	irq	NONE;		# No IRQ allowed
	sigmgr          rs;	# Signal manager is RS
	scheduler   KERNEL;	# Scheduler is KERNEL (prevents console stalls)
	priority	 1;	# priority queue 1
	quantum	        50;	# default driver quantum
};

service memory
{
	uid     0;
	ipc	ALL_SYS;	# All system ipc targets allowed
	system			# Extra kernel calls allowed:
		UMAP		# 14
		VIRCOPY		# 15
		PHYSCOPY	# 16
		IRQCTL		# 19
		DEVIO		# 21
		SDEVIO		# 22
		VDEVIO		# 23
		IOPENABLE	# 28
		;
	vm	BASIC;		# Only basic VM calls allowed
	io	NONE;		# No I/O range allowed
	irq	NONE;		# No IRQ allowed
	sigmgr          rs;	# Signal manager is RS
	scheduler   KERNEL;	# Scheduler is KERNEL
	priority	 3;	# priority queue 3
	quantum	        50;	# default driver quantum
};

service log
{
	ipc		SYSTEM vfs rs vm;
	priority	2;
};

service mib
{
	system
		VIRCOPY		# 15
	;
	ipc	ALL;
	uid	0;
};

service init
{
	uid     0;
	ipc			# ipc targets allowed:
		pm vfs rs vm
		;
	system	NONE;		# No kernel calls allowed
	vm	BASIC;		# Only basic VM calls allowed
	io	NONE;		# No I/O range allowed
	irq	NONE;		# No IRQs allowed
	sigmgr          pm;	# Signal manager is PM
};

#
# Dynamically started system services
#

service floppy
{
	irq	6;
	io	3f0:8
		0:10	# DMA controller
		81	# Also DMA
		;
	system
		UMAP		# 14
		IRQCTL		# 19
		DEVIO		# 21
		VDEVIO		# 23
		;
};

service readclock.drv
{
	ipc	ALL;
	# The clock of a PC is behind I/O ports 70 and 71; on AArch64 it is
	# a node of the device tree.  Each line grants only where its bus
	# exists, so both can stand here.
	io	70:2;
	devicetree	"arm,pl031";
	system
		PRIVCTL		# 4
		UMAP		# 14
		VIRCOPY		# 15
		DEVIO		# 21
		READBIOS	# 35
	;
	uid 0;
};

service is
{
	vm
		INFO
	;
	uid 0;
};

service acpi
{
	io	ALL;
	system
		PRIVCTL		#  4
		DEVIO		# 21
	;
	uid 0;
};

service pci
{
	io	cf8:8		# PCI bus controller
		4d0:2		# PIIX
	;
	system
		PRIVCTL		#  4
		DEVIO		# 21
	;
	uid 0;
};

service ahci
{
	system
		UMAP		# 14
		VUMAP		# 18
		IRQCTL		# 19
	;
	pci class
		1/6/1		# Mass storage / SATA / AHCI
	;
};

service virtio_blk
{
	system
		UMAP
		VUMAP
		IRQCTL
		DEVIO
	;

	# The same device on two kinds of machine: found on the PCI bus of
	# a PC, and as a node of the device tree on AArch64.  Each line grants
	# only where its bus exists, so both can stand here.
	pci device	1af4:1001;
	devicetree	"virtio,mmio";
};

service sdmmc
{
	system
		UMAP
		VUMAP
		IRQCTL
		DEVIO
		CACHECTL
	;

	# The SD/MMC host controllers, named by the same compatible strings
	# the driver matches on when it walks the tree.  RS grants the
	# registers and the interrupt of whichever nodes carry them, which is
	# what the PCI server does for a driver on a PC.  A line for a part
	# no node claims grants nothing, so a line can stand here for a
	# machine this one is not.  Every node that carries the string is
	# granted, which on the RK3566 includes the SDIO socket of the Wi-Fi
	# chip; the driver skips that one itself (sdmmc_host.c).
	devicetree	"rockchip,dwcmshc-sdhci";
	devicetree	"rockchip,rk3568-dw-mshc";
	devicetree	"snps,dw-mshc";
	devicetree	"allwinner,sun50i-a100-mmc";
	devicetree	"allwinner,sun50i-a100-emmc";
	devicetree	"allwinner,sun50i-a64-mmc";

	# And the clock-and-reset controller, because the tree gives both
	# controllers their clocks and reset lines there: the eMMC's five
	# resets and the multiplexer its card clock comes from, the SD
	# socket's reset, input clock and sampling phases.  Wider than one
	# would like - it is the machine's clock controller - but the
	# alternative is a driver that cannot clock or reset its own device.
	devicetree	"rockchip,rk3568-cru";
	devicetree	"allwinner,sun50i-h616-ccu";
};

service at_wini
{
	io	1f0:8		# Controller 0
		3f6		# Also controller 0
		170:8		# Controller 1
		376		# Also controller 1
	;
	irq
		14		# Controller 0
		15		# Controller 1
	;
	system
		UMAP		# 14
		IRQCTL		# 19
		DEVIO		# 21
		SDEVIO		# 22
		VDEVIO		# 23
	;
	pci class		# Match these PCI classes:
		1/1			# Mass storage / IDE
	;
	pci device		# In addition, match these devices:
		1106:3149		# VIA VT6420 RAID (1/4)
		1095:3512/1095:6512	# Silicon Image SATA RAID (1/4)
		1095:3114/1095:3114	# Silicon Image SATA RAID (1/80)
	;
};

service procfs
{
	system
		VIRCOPY		# 15
	;
	vm
		INFO
		SETCACHEPAGE
		CLEARCACHE
	;
	uid	0;
};

service isofs
{
	system
		UMAP            # 14
	;
	vm	MAPCACHEPAGE
		SETCACHEPAGE
		CLEARCACHE
	;
	uid	0;
};

service hgfs
{
	ipc
		SYSTEM pm vfs rs vm
	;
	vm
		SETCACHEPAGE
		CLEARCACHE
	;
};

service filter
{
	ipc
		SYSTEM pm vfs rs ds vm
		at_wini
	;
	control
		at_wini
	;
};

service input
{
        ipc		SYSTEM pm vfs rs ds tty vm;
        priority	1;
};


service pckbd
{
	system
			IRQCTL		# 19
			DEVIO		# 21
	;
	io      	60:8;		# Keyboard, keyboard command/status
	irq
			1		# Keyboard
			12		# Auxiliary input (mouse)
	;
	ipc		SYSTEM pm rs ds vm input;
	priority	1;
};

service devman
{
	uid 0;
	vm
		SETCACHEPAGE
		CLEARCACHE
	;
};

service mmc
{
	system
		PRIVCTL		#  4
		IRQCTL          # 19
	;
	# Interrupts allowed
	irq
		64
		83
	;		# IRQs allowed
	priority	 4;	# priority queue 4
};

service fb
{
	system
		UMAP		# 14
                DEVIO           # 21
		PRIVCTL		#  4
		CACHECTL	# the controller reads behind the cache
		DIAGCTL		# take a loader's frame over from the kernel
        ;
	# The scanout buffers, mapped into the compositor that asks for
	# them (FBIOC_MAP in arch/aarch64/fb_ioc.h, stage 11.4).
	vm	REMAP
	;
	ipc
                SYSTEM pm rs ds vm vfs tty cat24c256 tda19988
	;

	# The display of an AArch64 machine, by the compatible strings the
	# driver matches on (minix/drivers/video/fb/arch/aarch64/).  A
	# picture is two parts and the SoC around them, so it is seven
	# lines, and each is asked for by name so that what it is for can
	# be read off this list:
	#
	#   rk3568-vop, rk3566-vop   the display controller (VOP2): the
	#                            vendor tree's name and mainline's
	#   rk3568-dw-hdmi           the HDMI encoder and, behind it, its PHY
	#   rk3568-grf               the encoder's DDC enables and the pins
	#   rk3568-cru               the bus and pixel clock gates and muxes
	#   rk3568-pmucru            HPLL, the PLL the pixel clock comes from
	#   rk3568-pmu               the VO power domain both parts sit in
	devicetree	"rockchip,rk3568-vop";
	devicetree	"rockchip,rk3566-vop";
	devicetree	"rockchip,rk3568-dw-hdmi";
	devicetree	"rockchip,rk3568-grf";
	devicetree	"rockchip,rk3568-cru";
	devicetree	"rockchip,rk3568-pmucru";
	devicetree	"rockchip,rk3568-pmu";
	# Or a frame the boot loader left running and the tree describes:
	# the Mi Pad 4's (Qualcomm ABL), drawn on and not reprogrammed.  Its
	# reg is the memory being scanned out.  The eighth line, which is as
	# many as RSS_NR_DEVICETREE allows.
	devicetree	"simple-framebuffer";
};

service cat24c256
{
	ipc SYSTEM RS DS i2c;
};

service tda19988
{
	ipc SYSTEM RS DS i2c;
};

service tps65217
{
	uid 0;		# needed for doing reboot()
	system IRQCTL PRIVCTL;
	irq 7;		# NNMI pin on BeagleBone / BeagleBone Black
	ipc SYSTEM RS DS PM i2c;
};

service tps65950
{
	ipc SYSTEM RS DS i2c readclock.drv;
};

service fbd
{
	ipc
		SYSTEM vfs rs ds vm
		ahci
		at_wini
	;
};

service vnd
{
	ipc
		SYSTEM vfs rs vm
	;
	uid	0;	# only for copyfd(2)
};

service pty
{
	system
		KILL		# 06
	;
	# pm, ds and ptyfs: grantpt(3) asks PM whose the master is
	# (getnuid) and makes the slave node on ptyfs, found by its label
	# in DS (pty/ptyfs.c).  Without them grantpt(3) was refused by the
	# kernel's IPC mask, always: Unix98 ptys never worked.
	ipc
		SYSTEM pm vfs rs vm ds ptyfs
	;
};

service ptyfs
{
	ipc
		SYSTEM pm vfs rs pty ds vm
	;
};

service edfictl
{
        ipc ALL;
};

service emmc
{
	system
		PRIVCTL
		IRQCTL
		PADCONF
	;
	irq
		28	# MMCSD1INT
	;
};
