service wcn
{
	system
		QCOMSCM		# TrustZone: the MSA's regions given to the
				# modem and the WLAN, and taken back (MP/ASSIGN)
		IRQCTL		# the copy engines' twelve lines
		CACHECTL	# the rings and buffers the engines read and
				# write are cacheable RAM, maintained by hand
		UMAP		# alloc_contig() of the DMA memory
	;
	# The WLAN's node: its registers (the copy engines), its twelve
	# lines, and by its memory-region the MSA.
	devicetree	"qcom,wcn3990-wifi";
};
