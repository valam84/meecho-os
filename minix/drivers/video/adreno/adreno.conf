service adreno
{
	system
		QCOMSCM		# TrustZone: questions about the zap shader's
				# calls (Q12), and the calls themselves - the
				# kernel checks every address they name (Q18)
		IRQCTL		# the GPU's line (fences) and the SMMU's bank-0
				# fault line
		UMAP		# the physical address of each page the SMMU
				# walks: page tables, test pages (alloc_contig),
				# and every page of a client's buffer
		UMAP_REMOTE	# the pages of a scanout buffer, where the
				# compositor has it mapped (meecho_drm.h,
				# as the mali service) - looked up, never
				# mapped
		CACHECTL	# the SMMU's walk does not see the processor's
				# caches: every table entry cleaned to memory;
				# a client's buffers around its jobs
		VIRCOPY		# the arrays a client's request points to (the
				# buffers and command buffers of a submission,
				# its sync objects) and the strings of
				# DRM_IOCTL_VERSION - always in the memory of
				# the process VFS names as the caller
	;

	# A client's buffers are this service's memory, mapped into the
	# client that asks for them through mmap(2) of the render node, as
	# the mali service lends them on the CB2 (libdrmdriver).
	vm	REMAP REMAP_RO
	;

	# Off the boot processor: the user-space scheduler keeps every
	# system process there, the kernel's places it where told.  If one
	# of this driver's reads ever stalled the bus, the core stalled would
	# be this one, and the boot processor's tick - with the boot watchdog
	# that resets the tablet into fastboot - would go on
	# (port/clover/hw-gpu.md, §12).  A call TrustZone stops for an
	# interrupt is resumed on the processor it stopped on, which this
	# also keeps the same.
	scheduler	KERNEL;
	priority	5;
	quantum		500;
	cpu		1;

	# Four nodes: the GPU (its window and line; and, by its zap-shader
	# child's memory-region, the region TrustZone loads the zap shader
	# into), its clock controller, the SoC's GCC (the GPU's bus and
	# memory branches; shared with sdmmc, qcom_touch and dwc3_ecm, each
	# writing only its own bits) and the GPU's SMMU.  "qcom,adreno-smmu"
	# and not "qcom,smmu-v2": the second would also grant the SoC's three
	# other SMMUs.
	devicetree	"qcom,adreno";
	devicetree	"qcom,gpucc-sdm660";
	devicetree	"qcom,gcc-sdm660";
	devicetree	"qcom,adreno-smmu";
	# The speed bin's fuse, read only (adreno_run.c): which of the
	# tree's operating points this chip may run.
	devicetree	"qcom,qfprom";
};
