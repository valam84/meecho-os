service qcom_mss
{
	system
		QCOMSCM		# TrustZone: the image region, the MBA's region
				# and the metadata given to the modem and
				# taken back (MP/ASSIGN)
		UMAP		# alloc_contig() of the metadata's buffer
	;

	# The modem's node (QDSP6SS and RMB; by its memory-region the MBA's
	# region and the image region), the GCC (the modem's branches and
	# MSS_RESTART; shared, each driver writing only its own bits), the
	# TCSR (the modem's AXI halt ports), SMEM (by its memory-region) and
	# its hardware lock, and the APCS block whose IPC register rings the
	# modem's smp2p.
	devicetree	"qcom,sdm660-mss-pil";
	devicetree	"qcom,gcc-sdm660";
	devicetree	"qcom,sdm630-tcsr";
	devicetree	"qcom,smem";
	devicetree	"qcom,tcsr-mutex";
	devicetree	"qcom,sdm660-apcs-hmss-global";

	# Its proxy votes for CX and MX go to qcom_rpm, which must be allowed
	# to answer (etc/system.conf).

	# Not the boot processor, as the GPU's service: a stalled read of a
	# block stalls this core, and the boot processor's tick and watchdog
	# go on.
	scheduler	KERNEL;
	priority	5;
	quantum		500;
	cpu		1;
};
