<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MEECHO's typeface (minix/share/style): Go Mono wherever a program asks
  for monospace - the terminal, the panel, the launcher - and Go for the
  rest (external/bsd/gofont).  After 50-user.conf, so that a user's own
  preferences come first; before 60-latin.conf, so that ours come before
  fontconfig's list of fonts MEECHO has not got.
-->
<fontconfig>
  <description>MEECHO: Go Mono for monospace, Go for the rest</description>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Go Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Go</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Go</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Go</family></prefer>
  </alias>
</fontconfig>
