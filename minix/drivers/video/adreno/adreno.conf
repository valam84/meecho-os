service adreno
{
	system
		QCOMSCM		# questions to TrustZone about the calls the
				# GPU's zap shader takes (Q12); questions only
	;

	# Off the boot processor: the user-space scheduler keeps every
	# system process there, the kernel's places it where told.  If one
	# of this driver's reads ever stalled the bus, the core stalled would
	# be this one, and the boot processor's tick - with the boot watchdog
	# that resets the tablet into fastboot - would go on
	# (port/clover/hw-gpu.md, §12).
	scheduler	KERNEL;
	priority	5;
	quantum		500;
	cpu		1;

	# Four nodes: the GPU (its window and line), its clock controller,
	# the SoC's GCC (the GPU's bus and memory branches; shared with
	# sdmmc, qcom_touch and dwc3_ecm, each writing only its own bits) and
	# the GPU's SMMU.  "qcom,adreno-smmu" and not "qcom,smmu-v2": the
	# second would also grant the SoC's three other SMMUs.
	devicetree	"qcom,adreno";
	devicetree	"qcom,gpucc-sdm660";
	devicetree	"qcom,gcc-sdm660";
	devicetree	"qcom,adreno-smmu";
};
