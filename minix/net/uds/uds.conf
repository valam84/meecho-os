service uds
{
	domain	LOCAL;
	system	KILL;	# for SIGPIPE
	uid	0;	# for socketpath(2) and copyfd(2)
	# MEECHO: без ds служба умирает на первой же строке, которую пишет:
	# sockdriver_announce() спрашивает у DS собственную метку, получает
	# отказ ядра ("ipc mask denied SENDREC") и паникует - "sockdriver:
	# unable to get own label". Ровно тот же пробел был у lwip в вехе
	# 8.4, и по той же причине: список писался под старый интерфейс, в
	# котором к DS не ходили.
	# И без pm: getsockopt(SO_PEERCRED) и socketpath(2) спрашивают у PM,
	# кто на том конце. Отказ виден как "UDS: failed obtaining
	# credentials of <pid>" - и он не безобиден: на нём разваливается
	# вход по ключу, потому что sshd проверяет права через свой
	# привилегированный монитор, а тот разговаривает через этот сокет.
	ipc
		SYSTEM vfs rs vm mib ds pm
	;
};
