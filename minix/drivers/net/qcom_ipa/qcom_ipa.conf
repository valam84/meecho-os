service qcom_ipa
{
	# The IPA's node: its window (BAM, registers, SRAM) and lines, and -
	# by its iommus - the apps SMMU its DMA goes through, whose stream
	# matches it reads (shared with the Wi-Fi's; see RS, dt_note_iommus).
	devicetree	"qcom,ipa-lite-v2.6";

	system
		UMAP		# alloc_contig(): the pipes' rings, the SMMU's
				# tables, the buffers
		CACHECTL	# the buffers and tables cleaned for the IPA and
				# the SMMU, which do not see the caches
	;

	# Its clock is the RPM's: qcom_rpm, which must be allowed to answer
	# (etc/system.conf).
	ipc
		SYSTEM pm rs ds vm vfs qcom_rpm
		lwip		# the interface ipa0
	;

	# Not the boot processor: a read the block does not answer stalls
	# the core it is on.  Not qcom_mss's either (1), which watches the
	# modem: the probe's first round stopped core 1 with a read of the
	# SMMU's banks, and the modem's watcher with it.
	scheduler	KERNEL;
	priority	5;
	quantum		500;
	cpu		2;
};
