service usb_mouse
{
	# What usb_kbd has, and for the same reasons: the mouse is reached
	# through the host controller service (the process xhci, under the
	# label "usbd"), its reports leave through the input server, and
	# nothing else is needed - no registers, no interrupts.
	ipc
		SYSTEM pm rs ds vm
		xhci input
	;
	uid	0;
};
