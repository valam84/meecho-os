service usb_ecm
{
	type	net;
	descr	"USB CDC Ethernet (ECM)";

	# No registers, no interrupts, no memory of a device: the device is
	# reached through the host controller service and the frames leave
	# through lwip, and those two are all it talks to besides the
	# system's own.  The controller runs under the label "usbd", but
	# this list names processes, and on this port the process is xhci
	# (usb_kbd.conf says the same).
	ipc
		SYSTEM pm rs ds vm
		xhci lwip
	;
	uid	0;
};
