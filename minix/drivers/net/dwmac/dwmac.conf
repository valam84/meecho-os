service dwmac
{
	type	net;
	descr   "Synopsys DWMAC with Rockchip glue";
	system
		UMAP
		VUMAP
		IRQCTL
		DEVIO
		CACHECTL
	;

	# Four nodes of the device tree, because this controller is four
	# blocks: itself, the GRF that holds its pin multiplexer and its
	# RGMII delay lines, the clock-and-reset controller that holds its
	# clocks and its link speed, and the GPIO bank whose one pin resets
	# its PHY.  Only the first is the controller; the other three are
	# shared with the rest of the machine, and that is a real cost of
	# this SoC rather than a shortcut here - a driver that cannot reach
	# them cannot bring its own device up.
	devicetree	"rockchip,rk3568-gmac";
	devicetree	"rockchip,rk3568-grf";
	devicetree	"rockchip,rk3568-cru";
	devicetree	"rockchip,gpio-bank";
};
