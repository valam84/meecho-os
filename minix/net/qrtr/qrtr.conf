service qrtr
{
	# AF_QIPCRTR (minix/net/qrtr): Qualcomm's IPC router, the way to the
	# modem's services.  SMEM (by its memory-region), its hardware lock,
	# and the APCS block whose IPC register rings the modem's GLINK edge.
	domain	QIPCRTR;
	devicetree	"qcom,smem";
	devicetree	"qcom,tcsr-mutex";
	devicetree	"qcom,sdm660-apcs-hmss-global";
	# ds: sockdriver_announce() asks it for the service's own label.
	ipc
		SYSTEM vfs rs vm mib ds pm
	;
};
