# /etc/dhcpcd.conf - what the DHCP client asks the network for.
#
# Without this file dhcpcd asks for an address and nothing else, and a
# server that answers only what was asked - the MikroTik on the bench, and
# QEMU's user-mode network alike - then sends no name servers, so
# /etc/resolv.conf ends up with a header and no "nameserver" line.  The
# list below is the one NetBSD ships, less what this system cannot use yet.

# Identify to the server the way every other system on this board does:
# hardware type and address, "01:<mac>".  NetBSD's default is a DUID, and
# that is right for a machine that is one system; this board is one
# hardware address shared between MEECHO and the vendor Linux it alternates
# with, and a DUID would make them two different clients holding two leases
# for one address.  The station address itself already comes from the SoC's
# fuses so that the two systems are the same machine to the network; the
# client identifier has to say so too.
clientid

# Keep the lease across reboots, so the same address comes back.
persistent

# Ask for the things /etc/resolv.conf and the routing table are made of.
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option ntp_servers

# A lease without a server identifier is a broken lease.
require dhcp_server_identifier

# No link-local fallback address, and not for the usual reason.  When the
# first DISCOVER goes unanswered - at boot it does, the link is not up yet -
# dhcpcd 6.9 starts probing for a 169.254 address in parallel, and if the
# lease then arrives while that probe is still alive, the routes it installs
# for the lease name the probe's address as the interface address (if_route
# in if-bsd.c: "istate == NULL ? &state->addr : &istate->addr").  NetBSD's
# kernel lets that pass; this system's network stack checks that the address
# exists on the interface and answers EADDRNOTAVAIL, and the default route
# is silently not there - only at boot, and only when the server took more
# than one DISCOVER to answer.  Without IPv4LL there is no probe state, and
# the interface address in every route is the leased one.
noipv4ll

# The hook that looks the machine's own name up in DNS holds the boot for a
# resolver that may not answer; the name from the lease is enough.
nohook lookup-hostname

# Do not add addresses on top of the ones an interface already has.
noalias
