service random
{
	# Аппаратный генератор случайных чисел, если он у машины есть: RS
	# выдаёт его регистры по строке compatible из дерева устройств, как
	# он делает это для часов и для контроллера eMMC. На машине без
	# такого узла строки не выдают ничего, и драйвер работает по-старому
	# - на временах прихода прерываний.
	#
	# Первое имя - вендорское, оно стоит в дереве BIGTREETECH CB2;
	# второе - имя того же блока в mainline.
	devicetree	"rockchip,cryptov2-rng";
	devicetree	"rockchip,rk3568-rng";

	# virtio-rng - источник эмулятора (virtio_rng.c). Как у virtio_blk:
	# на PCI - по идентификатору, в дереве - по узлу транспорта. IRQCTL
	# нужен libvirtio, которая заводит линию при готовности устройства,
	# хотя сам источник опрашивается по таймеру.
	system
		UMAP
		VUMAP
		IRQCTL
		DEVIO
	;
	pci device	1af4:1005;
	devicetree	"virtio,mmio";
};
