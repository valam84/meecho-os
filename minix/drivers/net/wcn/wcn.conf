service wcn
{
	system
		QCOMSCM		# TrustZone: the MSA's regions given to the
				# modem and the WLAN, and taken back (MP/ASSIGN)
		IRQCTL		# the copy engines' twelve lines
		CACHECTL	# the rings and buffers the engines read and
				# write are cacheable RAM, maintained by hand
		UMAP		# alloc_contig() of the DMA memory
	;
	# The WLAN's node: its registers (the copy engines), its twelve
	# lines, by its memory-region the MSA, and by its iommus the apps
	# SMMU (shared with the IPA; SMR 1 and bank 1 are the Wi-Fi's).
	devicetree	"qcom,wcn3990-wifi";

	# The supplies are the RPM's (qcom_rpm, which must let us in:
	# etc/system.conf); lwip takes the interface wlan0.
	ipc
		SYSTEM pm rs ds vm vfs qcom_rpm lwip
	;

	# Not the boot processor, not qcom_mss's (1) nor the IPA's (2): a
	# read a block does not answer stalls the core it is on.
	scheduler	KERNEL;
	priority	5;
	quantum		500;
	cpu		3;
};
